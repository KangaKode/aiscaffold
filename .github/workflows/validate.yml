# aiscaffold Validation Pipeline
# Runs on every push to main and every PR.
# Blocks merge on any failure.
#
# Four stages:
#   1. Quick checks (templates only)
#   2. Matrix validation: the web-app cell runs every generation profile
#      (full / gateway-off / minimal / defaults); the other cells vary
#      project_type/llm/persistence and run the full profile only.
#      Accepted trade-off: gateway-off/minimal DO honor the passed config,
#      so combos like gateway-off+postgres are deliberately not exercised
#      -- the toggle exclusions in copier.yml key only on the include_*
#      answers, and one cell per profile keeps CI cheap.
#   3. Security: blocking Gitleaks over full history + pip-audit against
#      core/ dependencies via the canonical audit gate. Independent of
#      quick-checks/matrix so a security regression fails visibly on its
#      own even if the rest of the pipeline is red.
#   4. Summary

name: Validate Scaffold

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install jinja2 pyyaml

      - name: Run quick checks
        run: python3 scripts/quick_checks.py

      - name: Run root unit tests
        run: python -m unittest discover -s tests -v

  validate-matrix:
    name: Validate (${{ matrix.project_type }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: quick-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # All generation profiles once, on the default config. Only the
          # defaults profile pins its own config; gateway-off/minimal
          # would honor other configs (e.g. gateway-off+postgres), but
          # that cross product is skipped as a deliberate cost trade-off:
          # the conditional _exclude/gating logic keys only on include_*
          # answers, not on project_type/llm/persistence.
          - project_type: web-app
            llm_provider: anthropic
            persistence: sqlite
            profile: all
          # Config variety: full profile with different type/provider/db.
          - project_type: multi-agent
            llm_provider: openai
            persistence: postgres
            profile: full
          - project_type: api-service
            llm_provider: anthropic
            persistence: sqlite
            profile: full

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          pip install copier ruff bandit jinja2 pip-audit==2.10.1

      - name: Run full validation
        run: |
          bash scripts/validate_generated.sh \
            "${{ matrix.project_type }}" \
            "${{ matrix.llm_provider }}" \
            "${{ matrix.persistence }}" \
            "${{ matrix.profile }}"

  security:
    name: Security (Gitleaks + pip-audit)
    runs-on: ubuntu-latest
    # No `needs:` -- security is independent of quick-checks/validate-matrix
    # so a scanner regression surfaces on its own instead of hiding behind
    # an earlier red job.
    steps:
      # fetch-depth: 0 is REQUIRED so Gitleaks can walk full history;
      # a shallow clone would only scan the head commit and reintroduced
      # secrets from older commits would slip through.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Gitleaks: full-history secret scan. Pinned to a commit SHA (not a
      # tag) so a compromised or moved tag cannot silently ship a
      # different scanner into this workflow. The action honours the
      # repo-root .gitleaksignore (commit-scoped fingerprints only) so a
      # historical fixture fingerprint does not re-fire; there is no
      # allowlist file that would mask future findings.
      #
      # GITLEAKS_LICENSE is intentionally NOT set: this action is
      # license-free for public repositories and personal accounts.
      # Forks inside a GitHub *organization* need to add
      # GITLEAKS_LICENSE as a repo secret -- documented in
      # docs/DEVELOPMENT_PROCESS.md, not solved by CI.
      - name: Run Gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pip-audit==2.10.1
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      # pip-audit against core/. Installing the project puts its actual
      # resolved dependencies (copier, typer, rich) into the runner
      # environment; the canonical audit gate then invokes pip-audit
      # over that environment with any active exception rows converted
      # to explicit --ignore-vuln pairs. `core/` (path-like) appears in
      # THIS step's run script so the block-scoping test can verify the
      # gate is actually scoped to the core project, not the wider
      # scaffold. The gate lives once at
      # template/{{project_slug}}/scripts/pip_audit_gate.py; the root
      # workflow invokes that same file (no duplicate at repo root).
      - name: Audit core/ dependencies with pip-audit gate
        run: |
          pip install ./core/
          python "template/{{project_slug}}/scripts/pip_audit_gate.py" \
            --exceptions .github/pip-audit-exceptions.json

  summary:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [quick-checks, validate-matrix, security]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.quick-checks.result }}" != "success" ] || \
             [ "${{ needs.validate-matrix.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ Validation FAILED"
            echo "  quick-checks: ${{ needs.quick-checks.result }}"
            echo "  validate-matrix: ${{ needs.validate-matrix.result }}"
            echo "  security: ${{ needs.security.result }}"
            exit 1
          fi
          echo "✅ All validations passed"
