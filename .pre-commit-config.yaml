# Pre-commit hooks for the aiscaffold scaffold repo.
# Fast checks only (<5 seconds total). Full validation runs in CI.
#
# Install: pre-commit install
# Manual:  pre-commit run --all-files

repos:
  # Quick template checks (banned patterns, file sizes, IP protection, syntax)
  - repo: local
    hooks:
      - id: quick-checks
        name: Quick template validation
        entry: python3 scripts/quick_checks.py
        language: system
        pass_filenames: false
        always_run: true

  # Prevent committing secrets
  - repo: local
    hooks:
      - id: no-secrets
        name: No hardcoded secrets
        language: system
        types: [python]
        entry: >-
          python3 -c "import re, sys; patterns = [(r'[\"\\']sk-[a-zA-Z0-9]{20,}[\"\\']', 'API key (sk-...)'), (r'AKIA[0-9A-Z]{16}', 'AWS access key')]; found = False;
          exec('''\nfor f in sys.argv[1:]:\n  try:\n    content = open(f).read()\n    for p, d in patterns:\n      for m in re.finditer(p, content):\n        print(f\"SECRET FOUND in {f}: {d}\")\n        found = True\n  except Exception:\n    pass\nsys.exit(1 if found else 0)\n''')"

  # Prevent large files
  - repo: local
    hooks:
      - id: file-size-check
        name: File size limit (800 lines)
        language: system
        types: [python]
        entry: >-
          python3 -c "import sys; failed = False;
          exec('''\nfor f in sys.argv[1:]:\n  try:\n    lines = len(open(f).readlines())\n    if lines > 800:\n      print(f\"BLOCKED: {f} is {lines} lines (max 800)\")\n      failed = True\n  except Exception:\n    pass\nsys.exit(1 if failed else 0)\n''')"
