_min_copier_version: "9.0.0"

# The template code lives in template/{{project_slug}} -- a literal folder
# name, escaped below so copier does NOT render it as a path variable. The
# copier destination directory therefore IS the generated project root
# (git repo, .copier-answers.yml, Makefile all live together), which is
# what makes `copier update` work. See docs/UPDATING.md.
_subdirectory: "template/{% raw %}{{project_slug}}{% endraw %}"

# Overriding _exclude replaces copier's defaults, so they are restated here.
# Patterns are matched against destination paths relative to the project
# root. The conditional entries exclude feature trees when their toggle is
# off:
#   include_evals=false       -> no evals/ tree
#   include_api_gateway=false -> no src/<slug>/api/ tree
#   include_deployment=false  -> no Dockerfile, docker-compose*, .dockerignore, deploy/
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if not include_evals %}/evals{% endif %}"
  - "{% if not include_evals %}/evals/**{% endif %}"
  - "{% if not include_api_gateway %}/src/*/api{% endif %}"
  - "{% if not include_api_gateway %}/src/*/api/**{% endif %}"
  - "{% if not include_deployment %}/Dockerfile{% endif %}"
  - "{% if not include_deployment %}/Dockerfile.jinja{% endif %}"
  - "{% if not include_deployment %}/docker-compose*.yml{% endif %}"
  - "{% if not include_deployment %}/docker-compose*.yml.jinja{% endif %}"
  - "{% if not include_deployment %}/.dockerignore{% endif %}"
  - "{% if not include_deployment %}/deploy{% endif %}"
  - "{% if not include_deployment %}/deploy/**{% endif %}"

# =============================================================================
# PROJECT IDENTITY
# =============================================================================

project_name:
  type: str
  help: "Human-readable project name (e.g., 'My AI Tool')"
  validator: >-
    {% set invalid = namespace(value=false) %}
    {% for ch in project_name %}
    {% if not ch.isascii() or not (ch.isalnum() or ch == ' ' or ch == '_' or ch == '-') %}
    {% set invalid.value = true %}
    {% endif %}
    {% endfor %}
    {% if not project_name.strip() or invalid.value %}
    project_name may contain only ASCII letters, numbers, spaces, underscores, and hyphens.
    {% endif %}

project_slug:
  type: str
  default: >-
    {%- set slug = namespace(value='') -%}
    {%- for char in project_name | lower -%}
    {%- if char.isascii() and (char.isalnum() or char == '_') -%}
    {%- set slug.value = slug.value + char -%}
    {%- else -%}
    {%- set slug.value = slug.value + '_' -%}
    {%- endif -%}
    {%- endfor -%}
    {%- set candidate = slug.value.strip('_') -%}
    {%- if not candidate -%}
    project
    {%- elif candidate[0].isdigit() -%}
    project_{{ candidate }}
    {%- else -%}
    {{ candidate }}
    {%- endif -%}
  help: "Python-safe project directory name"
  validator: >-
    {% if not project_slug.isascii() or not project_slug.isidentifier() %}
    project_slug must be an ASCII Python identifier (letters, numbers, and underscores; cannot start with a number).
    {% endif %}

project_description:
  type: str
  default: "An AI-powered tool"
  help: "One-line project description"

author_name:
  type: str
  default: "Your Name"
  help: "Your name (used in generated docs and configs)"

# =============================================================================
# PROJECT TYPE
# =============================================================================

project_type:
  type: str
  help: "What kind of project?"
  choices:
    - "web-app"
    - "cli-tool"
    - "multi-agent"
    - "api-service"
  default: "web-app"

# =============================================================================
# ARCHITECTURE LAYERS
# =============================================================================

layers:
  type: str
  help: "Architecture layers (comma-separated, bottom-to-top dependency order)"
  default: "{% if project_type == 'web-app' %}data,analysis,components{% elif project_type == 'cli-tool' %}data,logic{% elif project_type == 'multi-agent' %}data,analysis,orchestration,specialists,prompts{% elif project_type == 'api-service' %}data,service,routes{% endif %}"
  validator: >-
    {% set invalid = namespace(value=false) %}
    {% for layer in layers.split(',') %}
    {% set layer_name = layer.strip() %}
    {% if not layer_name or not layer_name.isascii() or not layer_name.isidentifier() %}
    {% set invalid.value = true %}
    {% endif %}
    {% endfor %}
    {% if invalid.value %}
    layers must be comma-separated ASCII Python identifiers (for example: data,analysis,components).
    {% endif %}

# =============================================================================
# TECH CHOICES
# =============================================================================

llm_provider:
  type: str
  help: "Primary LLM provider"
  choices:
    - "anthropic"
    - "openai"
    - "google"
    - "multi"
  default: "anthropic"

# NOTE (honest scope): `persistence` scaffolds database wiring for YOUR
# application code -- driver dependency, docker-compose db service,
# DATABASE_URL/DATABASE_PATH env plumbing, and docs. No shipped runtime
# module reads those variables. The platform's own storage (learning
# store) is configured separately via `learning_backend` below.
persistence:
  type: str
  help: "App database scaffolding for your own code: driver dep + compose service + env plumbing (the built-in learning store is configured by learning_backend)"
  choices:
    - "sqlite"
    - "postgres"
    - "none"
  default: "sqlite"

learning_backend:
  type: str
  help: "Learning system storage backend (postgres needs the 'postgres' extra: pip install '.[postgres]')"
  choices:
    - "sqlite"
    - "postgres"
  default: "sqlite"

python_version:
  type: str
  default: "3.13"
  help: "Minimum Python version (3.12 or newer, e.g. 3.13)"
  validator: >-
    {% set parts = python_version.split('.') %}
    {% if parts | length != 2 or not parts[0].isdigit() or not parts[1].isdigit() %}
    python_version must be MAJOR.MINOR, for example 3.13.
    {% elif parts[0] != '3' or parts[1] | int < 12 %}
    python_version must be 3.12 or newer (the generated code uses 3.12+ syntax).
    {% endif %}

# =============================================================================
# OPTIONS
# =============================================================================

include_evals:
  type: bool
  default: true
  help: "Include eval infrastructure?"

include_api_gateway:
  type: bool
  default: true
  help: "Include API gateway (FastAPI) for external access and remote agents?"

include_deployment:
  type: bool
  default: true
  help: "Include deployment infrastructure (Dockerfile, docker-compose, K8s)?"

include_learning:
  type: bool
  default: false
  help: "Include optional RAG dependency guidance + learning docs? (The learning modules themselves ship in every project.)"

# =============================================================================
# POST-GENERATION
# =============================================================================

# Tasks run in the destination directory, which is the project root.
_tasks:
  # Create architecture layer directories
  - "python3 -c \"import os; [os.makedirs(l.strip(), exist_ok=True) or open(os.path.join(l.strip(), '__init__.py'), 'w').close() for l in '{{ layers }}'.split(',')]\""
  # Create evals directory if requested
  - "{% if include_evals %}mkdir -p evals/capability evals/regression evals/graders evals/results && touch evals/__init__.py evals/graders/__init__.py{% else %}echo 'Evals skipped'{% endif %}"
  # Init git (idempotent; `copier update` runs inside the existing repo)
  - "git init"
  # Summary
  - "echo ''"
  - "echo 'Project created!'"
  - "echo ''"
  - "echo '  Development subagents (.cursor/agents/)'"
  - "echo '  Architecture enforcement (tests/test_architecture.py)'"
  - "echo '  Red team pre-commit hook (scripts/red_team_check.py)'"
  - "echo '  CI/CD pipeline (.github/workflows/ci.yml)'"
  - "echo '  LLM client with prompt caching (src/{{ project_slug }}/llm/)'"
  - "echo '  Round Table + Chat Orchestrator (src/{{ project_slug }}/orchestration/)'"
  - "echo '  Security hardened (SSRF, injection, rate limiting, auth)'"
  - "{% if include_api_gateway %}echo '  API gateway with 10 routes (src/{{ project_slug }}/api/)'{% else %}echo ''{% endif %}"
  - "{% if include_deployment %}echo '  Docker + K8s deployment templates'{% else %}echo ''{% endif %}"
  - "{% if include_learning %}echo '  Learning system (feedback, trust, preferences, RAG)'{% else %}echo ''{% endif %}"
  - "echo ''"
  - "echo 'Next steps:'"
  - "echo '  cd {{ _folder_name }}'"
  - "echo '  python3 -m venv venv && source venv/bin/activate'"
  - "echo '  pip install -r requirements.txt'"
  - "echo '  pip install -e .       # Install the src-layout package'"
  - "echo '  cp .env.example .env  # Add your API keys'"
  - "echo '  pre-commit install'"
  - "echo '  make test'"
  - "echo '  make demo          # See the round table in action (no API keys needed)'"
  - "{% if include_api_gateway %}echo '  make serve         # Start API gateway (http://localhost:8000/docs)'{% else %}echo ''{% endif %}"
  - "{% if include_deployment %}echo '  make docker-run    # Run with Docker'{% else %}echo ''{% endif %}"
